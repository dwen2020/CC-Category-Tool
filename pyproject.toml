[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-tool"
version = "0.0.1"
description = "Local credit-card statement categorization tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber",
  "pydantic>=2.0",
  "python-dotenv",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "watchdog>=4.0",
  "python-multipart>=0.0.9",
  "torch>=1.10",
  "transformers>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "huggingface_hub>=0.20"]

[project.scripts]
cc-tool = "cc_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_tool"]
